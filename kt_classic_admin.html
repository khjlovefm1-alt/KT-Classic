<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주차 현황 관리 | KT 클래식</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --kt-red: #E3000F; --kt-red-dark: #B0000B;
    --white: #FFFFFF; --off-white: #F7F5F3;
    --text-dark: #1A1A1A; --text-mid: #555; --text-light: #999;
    --border: #EBEBEB;
  }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--off-white); color: var(--text-dark); min-height: 100vh; }

  .topbar { background: var(--text-dark); padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; }
  .topbar-title { font-family: 'Noto Serif KR', serif; font-size: 15px; font-weight: 600; color: white; display: flex; align-items: center; gap: 10px; }
  .topbar-badge { font-family: 'Noto Sans KR', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; background: var(--kt-red); color: white; padding: 3px 10px; border-radius: 20px; }
  .topbar-event { font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 0.06em; }

  .main { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
  .stat-card { background: var(--white); border-radius: 14px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); text-align: center; }
  .stat-card.highlight { background: var(--kt-red); color: white; }
  .stat-number { font-family: 'Noto Serif KR', serif; font-size: 32px; font-weight: 600; line-height: 1; margin-bottom: 6px; }
  .stat-label { font-size: 11px; letter-spacing: 0.08em; opacity: 0.7; }

  .controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .section-title { font-family: 'Noto Serif KR', serif; font-size: 15px; font-weight: 600; color: var(--text-dark); }
  .btn-row { display: flex; gap: 8px; }
  .btn { height: 36px; padding: 0 16px; border-radius: 8px; font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; border: none; transition: background 0.2s, transform 0.1s; display: flex; align-items: center; gap: 6px; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--kt-red); color: white; }
  .btn-primary:hover { background: var(--kt-red-dark); }
  .btn-ghost { background: var(--white); color: var(--text-mid); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--off-white); }

  .table-wrap { background: var(--white); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.05); }
  table { width: 100%; border-collapse: collapse; }
  thead { background: #F9F9F9; border-bottom: 1px solid var(--border); }
  thead th { padding: 13px 20px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: var(--text-light); text-align: left; }
  thead th:last-child { text-align: center; }
  tbody tr { border-bottom: 1px solid #F5F5F5; transition: background 0.15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #FAFAFA; }
  td { padding: 15px 20px; font-size: 14px; color: var(--text-dark); }
  td.plate { font-size: 16px; font-weight: 600; letter-spacing: 0.1em; }
  td.time { font-size: 12px; color: var(--text-light); }
  td.num { font-size: 12px; color: var(--text-light); text-align: center; }
  td.action { text-align: center; }

  .del-btn { background: none; border: 1px solid #EEE; color: #CCC; font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
  .del-btn:hover { border-color: var(--kt-red); color: var(--kt-red); background: #fff8f8; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 14px; }
  .loading-state { text-align: center; padding: 50px 20px; color: var(--text-light); font-size: 13px; }

  .refresh-info { font-size: 11px; color: var(--text-light); margin-top: 12px; text-align: right; }
  .dot-live { display: inline-block; width: 6px; height: 6px; background: #4CAF50; border-radius: 50%; margin-right: 4px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1A1A1A; color: white; padding: 12px 24px; border-radius: 30px; font-size: 13px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); z-index: 999; display: flex; align-items: center; gap: 8px; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  @media (max-width: 480px) {
    .stats-row { grid-template-columns: 1fr 1fr; }
    .topbar { padding: 14px 16px; }
    td { padding: 12px 14px; }
    thead th { padding: 10px 14px; }
    .topbar-event { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg>
    주차 현황 관리
    <span class="topbar-badge">ADMIN</span>
  </div>
  <div class="topbar-event">마음을 담은 클래식 · 2025.06.25</div>
</div>

<div class="main">
  <div class="stats-row">
    <div class="stat-card highlight">
      <div class="stat-number" id="statTotal">–</div>
      <div class="stat-label">총 등록 차량</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="statLast">–</div>
      <div class="stat-label">최근 등록</div>
    </div>
    <div class="stat-card">
      <div class="stat-number">6.25</div>
      <div class="stat-label">공연 일자</div>
    </div>
  </div>

  <div class="controls">
    <span class="section-title">등록 차량 목록</span>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="loadPlates()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        새로고침
      </button>
      <button class="btn btn-primary" onclick="exportCSV()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        CSV 저장
      </button>
    </div>
  </div>

  <div class="table-wrap">
    <div class="loading-state" id="loadingState">데이터를 불러오는 중...</div>
    <table id="plateTable" style="display:none;">
      <thead>
        <tr>
          <th>NO</th>
          <th>차량번호</th>
          <th>등록 시간</th>
          <th>삭제</th>
        </tr>
      </thead>
      <tbody id="plateBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin:0 auto;display:block;opacity:0.3;"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg>
      <p>아직 등록된 차량이 없습니다.</p>
    </div>
  </div>

  <div class="refresh-info"><span class="dot-live"></span>30초마다 자동 갱신</div>
</div>

<div class="toast" id="toast">
  <div class="toast-dot" id="toastDot"></div>
  <span id="toastMsg"></span>
</div>

<script>
  const API = 'https://script.google.com/macros/s/AKfycby_XxZeU875tQXioiMgLJUSY9o69ZdDUzAlifNOad0yjRvtfmvpdWbjGY6T84fw83ZT/exec';
  let plates = [];

  async function loadPlates() {
    try {
      const res = await fetch(API + '?action=get');
      plates = await res.json();
    } catch { plates = []; }
    renderTable();
  }

  async function deletePlate(id) {
    if (!confirm('이 차량을 목록에서 삭제할까요?')) return;
    try {
      await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'delete', id }) });
      await loadPlates();
      showToast('삭제되었습니다.', false);
    } catch {
      showToast('삭제 중 오류가 발생했습니다.', false);
    }
  }

  function renderTable() {
    const loading = document.getElementById('loadingState');
    const table = document.getElementById('plateTable');
    const empty = document.getElementById('emptyState');
    const body = document.getElementById('plateBody');

    loading.style.display = 'none';

    if (!Array.isArray(plates) || plates.length === 0) {
      table.style.display = 'none';
      empty.style.display = 'block';
      document.getElementById('statTotal').textContent = 0;
      document.getElementById('statLast').textContent = '–';
      return;
    }

    empty.style.display = 'none';
    table.style.display = 'table';
    body.innerHTML = '';

    [...plates].reverse().forEach((p, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="num">${plates.length - i}</td>
        <td class="plate">${p.plate}</td>
        <td class="time">${p.time}</td>
        <td class="action"><button class="del-btn" onclick="deletePlate(${p.id})">삭제</button></td>
      `;
      body.appendChild(tr);
    });

    document.getElementById('statTotal').textContent = plates.length;
    document.getElementById('statLast').textContent = plates[plates.length - 1].time;
  }

  function exportCSV() {
    if (!plates.length) { showToast('등록된 차량이 없습니다.', false); return; }
    const rows = [['번호', '차량번호', '등록시간'], ...plates.map((p, i) => [i+1, p.plate, p.time])];
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'kt_classic_주차목록.csv'; a.click();
    URL.revokeObjectURL(url);
    showToast('CSV 파일이 저장되었습니다.', true);
  }

  function showToast(msg, success = true) {
    const toast = document.getElementById('toast');
    document.getElementById('toastDot').style.background = success ? '#4CAF50' : '#E3000F';
    document.getElementById('toastMsg').textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2800);
  }

  loadPlates();
  setInterval(loadPlates, 30000);
</script>
</body>
</html>
